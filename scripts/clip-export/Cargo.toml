[package]
name = "nyamuru-clip-export"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]
resolver = "3"
members = ["vendor/name-studio/crates/clip-core", "vendor/name-studio/crates/name-model", "vendor/csp-format/crates/csp-format", "vendor/csp-format/crates/csp-assets"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nanikasheila/csp-format"
rust-version = "1.88"
homepage = "https://github.com/nanikasheila/csp-format"
authors = ["nanikasheila"]

[workspace.dependencies]
csp-format = { path = "vendor/csp-format/crates/csp-format" }
csp-assets = { path = "vendor/csp-format/crates/csp-assets" }

[dependencies]
clip-core = { path = "vendor/name-studio/crates/clip-core" }
csp-format.workspace = true
base64 = "0.22"
rusqlite = { version = "0.40.2", features = ["bundled", "serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
