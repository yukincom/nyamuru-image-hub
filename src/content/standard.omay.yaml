# Open Manga Artwork YAML (OMAY) v10.5 — Image-generation instruction file
# Nickname: Nyamuru🐱
#
# Artwork and visual-direction styles (style_notes) and layout specifications (layout_spec)
# for drawing manga from a storyboard in OMNY (Open Manga Name YAML) format.
#
# Usage:
# - Set this file once as the project instructions on the image-generation AI side (such as a ChatGPT project).
# - After that, only the OMNY file needs to be supplied for each work.
# - When revising the rules, update this file and replace the project instructions to apply the revision to every work.
#
# ■ Tag meanings
#   [const]    Immutable. OMNY cannot override it (it always wins in a conflict).
#   [must]     Wins in a conflict (minimum readability and safety requirements). OMNY may override it.
#   [panel]    A default that can be overridden at panel / action level. OMNY may override it.
#   [style]    A default that can be overridden by the work's visual style (OMNY meta.style_notes). OMNY may override it.
#   [default]  A default. Use it unless an override is specified. OMNY may override it.
#
# ■ Precedence (strongest first; cascading)
#   [const] > layout_spec,style_notes in omny.yaml > [must] > [panel] > [style] > [default]

spec_name: "Open Manga Artwork YAML"
spec_version: "10.5"

style_notes:
  # ### Dialogue text
  - "[const] Use the Japanese dialogue exactly as written in OMNY. Follow OMNY meta.text_orientation for text orientation, and meta.reading_direction for the reading direction of pages and panels."

  # ### Reading order
  - "[const] Read panels according to OMNY meta.reading_direction and ascending id numbers. For right-to-left, the rightmost panel in the same row must have the smallest id; preserve the order from top right to bottom left."

  # ### Page headers and footers
  - "[const] Place the work's title at the top left of each page and the page number in current/total-pages form (for example, 3/12) at the top right. Place header elements in the 10mm-high strip at the top edge (y=0–10mm). Except for panels whose bleed includes top, do not overlap the panel body (y=10 onward). When overlapping a top-bleed panel, draw the header in front of its artwork. Do not add speech bubbles; draw directly on the page."
  - "[const] If meta.author contains an author name, place it in small text at the bottom center of each page. Place footer elements in the 10mm-high strip at the bottom edge (within 10mm of the bottom), without speech bubbles; draw directly on the page. When overlapping a bottom-bleed panel (one that reaches the bottom edge of the paper), draw the footer in front of its artwork. If author is empty or unspecified, do not draw a footer."
  - "[must] Maintain readable contrast for header and footer text (work title, page number, author name), even when it overlaps full-bleed panel artwork. Add a thin white outline to the text if necessary."
  - "[style] Header text: place the work title approximately 10mm from the left edge at y=7, left-aligned, with a font size of approximately 5mm; place the page number approximately 10mm from the right edge at y=7, right-aligned, with a font size of approximately 5mm. Text color is black."
  - "[style] Footer text: place it approximately at the center of the paper width, 3mm from the bottom edge, center-aligned, with a font size of approximately 4mm. Text color is black."

  # ### Overall rendering
  - "[style] Follow OMNY meta.format for the work's output format. Render color manga with line art and flat colors (gradients as needed), monochrome manga with black-and-white line art, solid fills and screentones, and grayscale manga with gray tonal values."

  # ### Background colors
  - "[style] Background color by bg value: bg:-1 uses the default single mid-gray flat fill (no gradients). Prioritize panels[].background_description for background colors, effects and concrete objects; only when it is unspecified may explicit instructions in action be used as a reference. bg:0 uses a background color appropriate to the scene and emotion (flat fill or gradient; for example, anger=reds / joy=warm colors / surprise=yellows / tension=purple to navy / being moved=gold to pink / stillness=blues). bg:1 uses a background-color gradient appropriate to the scene. A solid-white background is prohibited for bg:0/1; always use a color appropriate to the scene."

  # ### Image size
  - "[style] Image size: the default is A4 portrait (width 210mm × height 297mm). Follow any size specified by the work instead (OMNY panel and bbox coordinates are written relative to that paper size)."

  # ### Text rendering
  - "[style] Follow OMNY meta.font for the fonts used in body text, inner thoughts and captions. If meta.font is the literal font identifier 'アンチック体' (Japanese manga's mixed Gothic/Mincho lettering), render kanji in Gothic and hiragana/katakana in Mincho."
  - "[style] A bubble's emphasis specifies phrases to render in larger lettering within that bubble. Separate multiple phrases with half-width commas, and render each phrase at 1.3–1.5 times the normal size."

  # ### Background-color saturation
  - "[style] Keep bg:0/1 background colors at low to medium saturation (muted or pastel-leaning). Background gradients convey atmosphere and must not draw more attention than the characters and dialogue. Limit vivid, highly saturated backgrounds to panels with a clear dramatic purpose, such as an emotional outburst or the strongest emphasis."

  # ### Color script
  - "[default] Treat background colors across the work as a connected flow of color following emotional rises and falls (a dramatic curve), like a film color script. Larger hue differences between adjacent panels convey stronger scene or emotional transitions. Lighting expressions may also guide the choice of manga symbols and gradients (for example, backlighting=seriousness, top lighting=sacredness, lighting from below=unease, glowing bokeh circles=being moved)."

layout_spec: |
  # Panel-layout coordinate system (for image-generation AI) — tagged and grouped by topic
  # (Each item's tag indicates its precedence. For the cascade, see "Precedence" at the top.)
  - [const] Within omny, instructions identifying a particular panel or region (panel / action)
    take precedence over meta.style_notes.

  ## Page specifications

  ### Number of output images (highest importance)
  - [const] Always output an N-page manuscript as N separate images.
  - [const] Each image contains only 1 sheet/page (use the image size in style_notes).
  - [const] Output each page as an independent image: page1, page2, ...
  - [const] Output all pages at identical pixel dimensions. Keep the dimensions of page 1 for every subsequent page.
  Prohibitions:
  - [const] Do not combine multiple pages in 1 image (two-page spreads are also prohibited).
  - [const] Do not introduce spacing between pages, side-by-side page displays, thumbnail sheets, two-page spreads or any similar arrangement.

  ### Canvas
  - [const] Origin: the top left is (0,0). x increases to the right, y increases downward. Units are mm.
  - For paper size, refer to the image size in style_notes.

  ### Page headers and footers
  - Refer to style_notes for page headers and footers: their content, coordinates and rendering treatment.
  - [const] For the page number's current/total-pages form, use the actual number of pages in OMNY
    as the total (N), identically on every page. Do not change it for rendering convenience.

  ## Generation workflow rules

  ### Generation workflow (single-pass generation including text)
  - [const] Render dialogue, speech bubbles, monologues, the work title and page numbers with the image-generation AI at the same time as the artwork.
  - [const] Generate each page in a single pass as a finished manga image containing dialogue and speech bubbles.
  - [const] Deliver the generated, finished PNG unchanged, without post-processing.
  Prohibitions:
  - [const] Do not generate text-free artwork and then typeset it afterward using code, image editing or local processing.
  - [const] Do not end the response with only an announcement that generation will begin.
    When a request is received, actually generate the images within that response,
    and finish by outputting the file paths of the generated images.

  ### Counts (do not arbitrarily add or remove panels or speech bubbles)
  - [const] Draw every panel listed in OMNY panels on its corresponding single page.
    Do not add or remove panels, merge 2 into 1, or split 1 into multiple panels.
    Even if a page looks crowded because it has many panels, do not omit panels to make room.
  - [const] Draw every speech bubble listed in each panel's bubbles.
    Do not omit dialogue, merge 2 bubbles into 1, or summarize their content.
    (If dialogue is too long, only split it according to "Split long dialogue into lengths that fit
    inside speech bubbles, using multiple bubbles"; do not remove any content.)
  - [const] If OMNY has page_overlay, do not count it as a panel or draw an enclosing panel border.
    After drawing all panels and panel borders, draw page_overlay.figures once on the page.
    Then draw normal in-panel speech bubbles and page_overlay.bubbles in front of all figures.
    Do not duplicate the overlay into individual panels or clip it to a single panel.
  Prohibitions:
  - [const] Do not adjust the counts of panels, speech bubbles or figures for composition or page-space reasons.
    Even if they appear not to fit, preserve the counts and report the issue.

  ### Self-inspection before delivery (the rendering side must look and correct)
  - [const] Before delivering each page, inspect the generated image yourself against the following items,
    and regenerate that page to correct anything you can before delivering it.
  - [const] Answer inspection questions by actually looking at the generated image, not by guessing.
    Judge whether the image actually meets the requirement, not whether it ought to have followed the instructions.
  - [const] Checklist:
    1. Count and dimensions: is an N-page manuscript represented by N separate images? Do all pages have identical pixel dimensions?
    2. Full bleed: do edges declared in bleed have no white margin remaining, not even 1mm?
    3. Dialogue text: does every bubble's text match OMNY text exactly, character for character?
       (No omissions, duplication, garbled characters or text protruding outside bubbles.)
    4. Headers and footers: does every page have the work title and page number,
       and the author-name footer when author is specified? Are they all readable rather than lost in the panel artwork?
    5. Reading order: are panels arranged for reading from top right to bottom left (ascending id)?
       When a row has 3 or more panels, does its rightmost panel have the smallest id in that row?
    6. Characters: have all people and objects listed in figures been drawn?
       Are there any characters not listed in figures? Are panels with no_figures: true unoccupied?
    7. Bubble overlap: do speech bubbles avoid characters' faces (the top 1/3 of each figure bbox)?
       Do their tails point toward the speakers' mouths?
    8. Background instructions: do bg:-1 panels contain only a single flat-color background? Do bg:0 panels
       avoid concrete background details such as scenery, interiors or props?
  - [const] Count the pages, panels and speech bubbles to verify their numbers,
    and report numerically whether they match OMNY.
  - [const] For any item still incorrect after regeneration, explicitly report its name and the remaining defect.
  Prohibitions:
  - [const] Do not satisfy inspection items through post-processing (image editing, typesetting or partial retouching).
    Corrections must always regenerate that page with image generation.
  - [const] Do not report an item as verified if it has not been checked.

  ### Materials (assets)
  - [const] Each panel's assets is a list of the materials referenced in that panel (keys in materials).
  - [const] Before drawing, use materials keywords to collect available material files
    (character reference images, backgrounds and props), and consult the materials listed in
    each panel's assets as references while drawing.
  - [default] Use background materials as art-setting references for the scene, to retain the location's design,
    colors, lighting and arrangement of props. For each panel, freely vary the camera angle, field of view and composition
    (close or distant shots, low angles, bird's-eye views, views from behind a character, or other viewpoints suited
    to the panel's direction), redraw the background, and integrate characters and background into one coherent image
    with matching light sources, color temperature, shadows and front-to-back occlusion relationships.
  - [default] If no image material corresponding to an asset can be found, do not stop to wait for it;
    you may freely design its appearance on the spot to match the materials note and the work's style.
    Once designed, keep that appearance consistent in subsequent panels.
  Prohibitions:
  - [default] Do not copy a background reference image's composition unchanged and composite characters on top.

  ## Visual-expression rules

  ### Cross-page consistency (prevent visual-style drift)
  - [const] Use page 1 as the reference for the entire work. From page 2 onward, maintain
    the same visual style, line weight and character, saturation and brightness ranges, paint density,
    and amount of visual information (detail density) as page 1.
  - [const] Do not change character construction (body proportions, facial-feature placement, hair volume or eye rendering)
    between pages. The same character must not look like a different person.
  - [const] Keep headers, footers, borders, margins, speech bubbles and fonts
    visually identical across all pages.
  Prohibitions:
  - [const] Do not omit detail or simplify the artwork on later pages.
    (Do not make lines thinner, coloring lighter or backgrounds fewer only in the later pages.)

  ### Preserve character identity when changing visual style
  - [const] Even when changing visual style, retain every character's identifying features (distinctive hair, ears,
    clothing components, signature colors and bodily features) by translating them into that style's visual language.
    Omitting a feature because the style cannot depict it is not allowed: if not with lines, use areas;
    if not with areas, use color; if not with color, use shape.
  - [const] Translate identifying features into forms explained by the physics and materials of that visual style.
    (For example, to place a pixel-art character in a live-action world, depict it as a printed acrylic stand.
    For stained glass, retain the pixel corners by treating the glass as material that can only be cut into squares.)
  - [const] Interpret a visual-style specification not merely as names of paints or media, but as instructions for shape,
    proportions, line character, the arrangement of black and white, and visual-information density. Changing only the medium
    while leaving the original shapes unchanged does not constitute a change of visual style.

  ### Panel shapes
  - [const] shape.type "rect": x, y, w, h define a rectangular panel (x,y are the top-left coordinates).
  - [const] shape.type "polygon": points [[x1,y1],[x2,y2],...] define vertex coordinates (for polygons and diagonal cuts).
  - [const] In layouts with overlapping panels (irregular panel layouts), draw smaller-id panels behind larger-id panels (panel 1 is the farthest back). Foreground panels overlap rear panels together with their white margins and borders.
  - [const] Draw each polygon panel as a polygon matching its specified vertex coordinates.
    Do not regularize it into a rectangle, even if it looks nearly rectangular or resembles a column layout.
    Always render diagonal edges as diagonal edges.

  ### Panel gaps and borders (full bleed)
  - [const] Render each panel edge in one of 2 ways, depending on whether bleed is declared for it.
  - [style] Normal edges (no bleed): follow OMNY meta.panel_frame_width_mm for panel-border thickness and meta.panel_gutter_row_mm / meta.panel_gutter_column_mm for vertical / horizontal spacing between adjacent panels. Draw each panel's border independently; adjacent panels must not share a border.
  - [const] For full-bleed edges (declared in the panel's bleed array as left / right / top / bottom;
    coordinates also meet the paper edge: left=x:0, right=x+w:paper width,
    top=y:0, bottom=y+h:paper height), use these steps:
    1. Leave no white margin at that edge, not even 1mm.
    2. Do not draw a panel border along that edge.
    3. Extend the artwork all the way to that edge of the image and crop it there.
  - [const] For a panel whose bleed declares top, place the panel behind the header-strip text
    (on a lower layer) and draw it all the way to the top edge (y=0), without a white margin.
    Draw the header text in front of the panel artwork.

  ### Background detail (bg)
  - [const] Each panel's bg value (-1/0/1/2) specifies the amount of background detail. Follow bg strictly for each panel. Refer to style_notes for background colors and color treatment.
  - [const] bg:-1=no background drawing. Use only a single flat-color fill. Draw characters, speech bubbles, panel borders and character-attached manga symbols (such as sweat drops or anger marks above the head) normally.
  - [const] bg:0=no concrete background. Add effects such as focus lines, manga symbols, tones, auras or sparkles over the background color to direct attention to the character's expression and emotions.
  - [const] bg:1=simple background. Over a background-color gradient, add 1–2 symbolic details indicating the setting (such as a wall line, window frame, desk edge or silhouette of a foreground prop). A foreground object with a background-color gradient behind it is also an acceptable depth composition.
  - [const] bg:2=detailed background. A showcase panel with a thoroughly rendered location.
  - [default] Limit bg:2 to 2 panels per page (at any positions). bg:-1 does not count toward this 2-panel limit.
  - [const] Ground-contact shadows at characters' feet are determined by bg: always include them for every value other than bg:-1, and do not draw them in bg:-1 panels (shadows are added with the background in a later stage).
  - [const] Mixing bg:-1 is completely unrestricted (it may appear with other bg values on the same page, and all panels may use bg:-1).
  Prohibitions:
  - [const] In bg:-1 panels, do not draw any background content beyond a single flat-color fill: no scenery, interiors or background-side effects (focus lines, tones, manga symbols, auras, etc.).
  - [const] Do not draw concrete backgrounds such as scenery, interiors or props in bg:0 panels (only emotional-color flat fills / gradients plus effects).

  ### Stage directions (action)
  - [const] panels[].action contains dialogue-independent stage directions for the whole panel's scene, camera and composition.
    figures[].action contains only the target character's expression, posture, gaze, body orientation, limb movements and contact.
    panels[].background_description contains locations, composition, perspective, lighting and emotional effects for the background layer only, excluding characters.
    When both give instructions about a character, prioritize figures[].action in rendering that character.

  ### Dramatic direction
  - [panel] For decisive lines, declarations of resolve, defiant speeches or important reactions, draw the speaker's face close up
    (from bust-up to a facial close-up). Make the panel somewhat larger than its neighbors,
    and use negative space, focus lines, gradient backgrounds or similar devices to emphasize the line's significance. If that panel's
    action explicitly requests a facial close-up, bust-up view, determined expression or similar direction, prioritize it.
  - [style] You may add effect lines and focus lines as appropriate based on action and the scene.

  ### Speech-bubble (bubbles) shapes and types
  - [const] Draw each speech bubble according to shape: normal=an ordinary rounded bubble /
    thought=a fluffy cloud-shaped bubble for inner monologue (thoughts and imagination) / square=a rectangular frame (inner soliloquy or retrospective narration) /
    caption=a caption box outside the panel frame (narration or passage of time; a rectangular box at a panel corner) /
    flash=jagged edges (shouting, strong surprise, telephone or machine speech) / uniflash=a sea-urchin flash:
    a spiky bubble with countless thin, needle-like lines radiating outward (the most extreme screaming or impact;
    it may also be combined with monologue: true for an unspoken, internally screamed reaction or retort) /
    wobbly=wavering, irregular lines (a weak, frightened or mumbling voice) / whisper=dotted lines (whispering) /
    handwritten=handwritten text with no speech bubble.
  - [default] If shape is unspecified, draw the bubble as normal (rounded).
  - [const] A bubble with monologue: true represents an inner thought (a per-bubble flag; the same panel
    may contain both spoken-dialogue bubbles and inner-thought bubbles).
  - [must] Split long dialogue into lengths that fit inside speech bubbles, using multiple bubbles.
  Prohibitions:
  - [const] Do not draw the parenthesis characters "（）" inside a monologue: true bubble.
    (Let the specified shape communicate that the text is an inner thought.)

  ### Text on screens, signs and paper (screen_text)
  - [const] Each panel's screen_text is an array of text on object surfaces such as screens, signs and paper, not speech bubbles (text / bbox / orientation).
  - [const] Draw the text directly on the object's surface, without a speech-bubble outline or tail.
  - [const] Render text exactly, character for character (do not omit or duplicate words).
  - [const] orientation: horizontal means horizontal text (keep half-width alphanumeric text horizontal; do not distort it into vertical writing); vertical means vertical text. The default is horizontal.
  - [const] bbox provides approximate rendering position and dimensions (mm).

  ### Interpreting bounding boxes for people and speech bubbles (figures / bubbles.bbox)

  #### Basic principle: placement precedence
  - [const] Interpret placement instructions according to the following precedence chain. If a higher and lower entry conflict, always follow the higher one.
    This table is the authoritative statement of precedence; every precedence statement elsewhere is a transcription of the same content.

    | Priority | Instruction | Role |
    |---|---|---|
    | 1 | panels[].action | Highest-level visual direction (explicit composition instructions such as a facial close-up or a view from behind). |
    | 2 | figures[].anchor | Mandatory placement instructions for people and props. |
    | 3 | Speaking order = standing position | A position rule only for characters without anchor (the first speaker is on the right; for a character with anchor, anchor wins). |
    | 4 | size | A body-framing instruction (takes precedence over bbox dimensions). |
    | 5 | bbox | Nonbinding hints for zone and size. A region reserving space and preventing overlap (intersection); errors of a few mm are acceptable. |

  - [must] In polygon panels, if a bbox protrudes across a diagonal panel edge, shift the drawing inward
    so that it fits inside the panel (do not draw across the diagonal edge).
  Prohibitions:
  - [const] Do not try to reproduce bbox with pixel-level precision. A bbox communicates
    the zone within the panel and approximate size; natural composition,
    character poses and coherent perspective take precedence over exact bbox reproduction.

  #### figures (placement of people and objects)
  - [const] name: the name of the subject to draw in that panel (a character name for a person, a materials key for an object).
    Draw every person and object listed in figures.
  - [const] action: image-generation instructions for that character only. Depict expression, posture, gaze, body orientation,
    limb movements and contact. Do not use it for backgrounds, cameras or visual style, and do not attach it to objects with object: true.
  - [const] figures is not limited to people: a figure with object: true specifies the placement of an object (such as a prop).
    Draw that object (whose name is a materials key) at its bbox / anchor position.
    It has placement (bbox / anchor) only, no face zone, and is not subject to character-specific rules
    such as speaking order = standing position or default center placement. size / role are not specified
    (its dimensions are given by bbox). Treat a figure without object as a person and apply all character rules.
  - [const] bbox: {x, y, w, h} in absolute canvas coordinates (mm). Nonbinding hints for zone and size.
    A region that reserves space and prevents overlap (intersection).
    - Infer full-body versus bust-up framing from its aspect ratio and interpret it together with size.
    - Draw the character's head within the top 1/3 of bbox (to make face position predictable;
      speech-bubble avoidance checks depend on this assumption).
  - [const] anchor: a relative position within the panel, using right / left / center / top-right / top-left /
    bottom-right / bottom-left. This is a placement command and must be obeyed.
  - [const] size: a body-framing command: full (full body) / waist-up (waist and above) /
    bust-up (chest and above) / face (facial close-up). It takes precedence over bbox dimensions.
    hand (hand only) / foot (foot only) / part (a body part only) instruct you to draw only that body part.
    Because no face is drawn, these have no face zone (top 1/3 of bbox) and are excluded from bubble-avoidance checks.
  - [const] role: the person's role. main (default)=the panel's main subject. sub=a supporting character, not the main subject.
    role declares subject importance, not placement. For position and size,
    follow bbox / anchor / size.
  Prohibitions:
  - [const] Do not draw characters not listed in figures inside the panel (a character specified in action as an off-panel voice
    needs only a speech bubble; do not depict their appearance).
  - [const] When a panel contains multiple characters, do not swap their relative anchor relationships
    (who is on the right and who is on the left).

  #### bubbles bbox
  - [const] bbox: approximate speech-bubble position and dimensions (mm). Nonbinding hints for zone and size,
    reserving space and preventing overlap (intersection). You may adjust dimensions to accommodate vertical text
    comfortably, but preserve the size hierarchy (a bubble with a larger bbox
    must be drawn larger).
  - [const] bubbles is an array, read in its listed order. A panel may contain multiple speech bubbles.
    The bubbles array order alone defines reading order (array order = top right to bottom left). bbox indicates placement only;
    if bbox coordinates appear to conflict with array order, prioritize array order
    and correct positions to establish top-right-to-bottom-left reading. Place each bubble close to its speaker
    (such as above the head or beside the face), and align the sequence of bubbles with the sequence of speakers in the panel
    (speakers are arranged right to left in speaking order, naturally producing top-right-to-bottom-left bubble reading).
    If proximity to speakers cannot coexist with top-right-to-bottom-left reading, prioritize array order as reading order
    and use tails to indicate the corresponding speakers. Place speakerless bubbles (captions, handwritten text,
    machine speech, etc.) in panel corners or empty space.
  - [const] speaker identifies each bubble's speaker. Specify it every time, even for consecutive lines by the same speaker.
    Treat a bubble without speaker as speakerless (narration, sound effects, etc.).
    The presence and direction of a tail depend on bubble type and tail: ① ordinary-speech types
    (normal/thought, etc., without offscreen): add a tail. tail: {x, y} gives the tip position
    relative to the speaker's figure bbox (values outside 0–1 are allowed). Keep it appropriately short, pointing toward the mouth. If omitted, target the figure center.
    ② tail: false, or types that have no tail by default such as square, caption, flash, uniflash and handwritten: no tail.
    ③ offscreen: true means a voice from outside the panel: no tail (the speaker is outside the panel and must not
    be drawn). For shape: thought, draw the tail as 2–3 vertically elongated ovals, becoming smaller farther from the bubble body.
    bbox describes the body only, excluding the tail, so the tail may extend outside bbox.
  Prohibitions:
  - [must] Speech bubbles must not overlap any character's face (head).
    The top 1/3 of each figure bbox is reserved as the face zone.
    Figures with size hand / foot / part, and object figures (object: true),
    have no face zone because no face is drawn.
    (Bubbles may overlap characters' bodies or backgrounds; this is normal manga presentation.)
  - [default] Do not include the Japanese full stop "。" inside speech bubbles (if OMNY text explicitly contains "。",
    the rule to reproduce OMNY dialogue exactly takes precedence, so draw it unchanged).

  #### Fallbacks (how figures is specified and how people are handled)
  - [const] The handling of people is determined by how figures is specified, with 3 cases:
    1. figures present: draw every listed character according to bbox / anchor / size.
    2. figures omitted: draw people. You may choose the composition freely under the speaking-order rule
       (speaking order = standing position; first speaker on the right), such as in emotional bg:0 panels.
    3. no_figures: true: an intentionally unoccupied panel. Draw no people at all.
       (Compose it only from off-panel voices, backgrounds, effects and props.)
  - [const] If bbox conflicts with anchor (for example, anchor:"left" but bbox lies in
    the right half of the panel), follow anchor and use bbox only as a size guide.
  - [panel] Link character positions in a panel to speaking order: place the character
    who speaks first (the first speaker in the bubbles array) on the right side of the panel, then arrange
    subsequent speakers from right to left in speaking order. Since bubbles are also placed close to their speakers,
    the bubble reading order naturally matches the character sequence. Apply this rule only to characters
    without anchor. Characters with anchor follow anchor. If action explicitly specifies
    composition or standing positions for that panel, prioritize those instructions.

  ## Artwork and visual-direction rules (reference)
  - Refer to style_notes for image size, overall rendering, reading order, dialogue text, text rendering, background colors, background-color saturation, color scripts, and page headers / footers (including coordinates).
