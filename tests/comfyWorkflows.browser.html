<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComfyUI登録設定のブラウザー検証</title>
<body>
  <p id="loading">検証を読み込み中…</p>
  <div id="test-root"></div>
  <script type="module">
    import('/tests/comfyWorkflows.browser.tsx').then(() => document.getElementById('loading')?.remove()).catch(error => {
      document.getElementById('loading').textContent = String(error);
      window.__comfyWorkflowTest = { done: true, passed: false, status: 'failed', checks: [], error: String(error) };
    });
  </script>
</body>
</html>
